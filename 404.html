    <meta property="og:type" content="website" />

    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="alternate" type="application/rss+xml" title="George Spanos" href="/rss.xml" />
    <link rel="stylesheet" href="/style.css" />
    <meta name="theme-color" content="#1d1f21" />
    <script>
      // Apply the saved theme before first paint, so there is no flash.
      (() => {
        const stored = localStorage.getItem("theme");
        const dark = stored
          ? stored === "dark"
          : matchMedia("(prefers-color-scheme: dark)").matches;
        document.documentElement.classList.toggle("dark", dark);
        document.querySelector('meta[name="theme-color"]').content = dark
          ? "#1d1f21"
          : "#fafafa";
      })();
    </script>
    <script defer data-domain="gspanos.tech" src="https://moby-it.com/js/script.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>

    <header class="site-header">
      <a class="site-title" href="/">George Spanos</a>
      <nav aria-label="Main">
        <a href="/">Home</a>
        <a href="/about/">About</a>
        <a href="/posts/">Blog</a>
        <button id="theme-toggle" type="button" aria-label="Toggle dark mode">
          <svg class="sun" aria-hidden="true"><use href="/icons.svg#sun" /></svg>
          <svg class="moon" aria-hidden="true"><use href="/icons.svg#moon" /></svg>
        </button>
      </nav>
    </header>

    <main id="main">
      <h1>404 | Oops something went wrong</h1>
      <p>Please use the navigation to find your way back.</p>
      <p><a href="/posts/">Browse all posts &rarr;</a></p>
    </main>

    <footer class="site-footer">
      <div>Copyright &copy; 2026 George Spanos</div>
      <nav aria-label="More on this site">
        <a href="/">Home</a>
        <a href="/about/">About</a>
        <a href="/posts/">Blog</a>
      </nav>
    </footer>

    <script src="/theme.js"></script>
  </body>
</html>
